# aistudio.yaml - 飞桨项目配置文件
name: IBD文献分析系统
description: 使用PaddlePaddle分析60万篇IBD文献的前沿研究
version: 1.0.0
author: Your Name
email: your_email@example.com

requirements:
  - paddlepaddle==2.5.0
  - paddlenlp==2.5.0
  - pandas==2.0.0
  - scikit-learn==1.3.0
  - sentence-transformers==2.2.2
  - requests==2.28.0
  - lxml==4.9.0
  - tqdm==4.66.0

environment:
  python: 3.8
  cuda: 11.2
  
hardware:
  gpu: 1
  cpu: 8
  memory: 32GB
  disk: 200GB

run_config:
  entry_file: paddle_main.py
  args: "--total 600000 --batch-size 10000 --topics 80 --use-gpu"
  max_runtime_hours: 48